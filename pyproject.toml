[project]
name = "entirius-django-todo"
version = "0.1.0"
description = "Tasks for people with a due date, about any object, with a today list and due reminders for Entirius"
keywords = ["django", "tasks", "todo", "reminders", "crm", "celery", "entirius"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "celery>=5.3",
    "celery-once>=3.0.1",
    "entirius-django-utils>=2.4.0",
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit"]
# Soft dependencies. access: the module declares its area on the AppConfig, nothing is imported.
# notifications: the due reminder is a no-op without it (imported lazily behind apps.is_installed()).
access = ["entirius-django-access>=1.1.0"]
notifications = ["entirius-django-notifications>=0.3.0"]
# The suite runs with notifications installed (`make install` = all extras) and skips what needs it otherwise.
test = [
    "pytest",
    "pytest-django",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.0",
]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-todo/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-todo"
Changelog = "https://github.com/entirius/entirius-django-todo/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-todo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_todo"]

# entirius-django-notifications 0.3.0 (recipient_user_id, escalate) is not on PyPI yet — resolve its develop branch
# until its release, then drop this block and re-lock.
[tool.uv.sources]
entirius-django-notifications = { git = "https://github.com/entirius/entirius-django-notifications", branch = "develop" }

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["django_todo"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# Soft dependency `access`: read from the AppConfig attributes by django_access, never imported here.
DEP002 = ["entirius-django-access"]
